name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Install Pods and Build Workspace
        run: |
          # 1. In das Projektverzeichnis wechseln
          PROJ_FILE=$(find . -name "*.xcodeproj" -not -path "*/Pods/*" | head -n 1)
          PROJ_DIR=$(dirname "$PROJ_FILE")
          cd "$PROJ_DIR"
          
          # 2. Pods neu installieren
          pod deintegrate || true
          pod install --repo-update

          # 3. Den generierten Workspace suchen
          WORKSPACE=$(find . -name "*.xcworkspace" -not -path "*/Pods/*" | head -n 1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list | awk '/Schemes:/{flag=1; next} /^[[:space:]]*$/{flag=0} flag' | head -n 1 | xargs)
          
          echo "Baue Workspace: $WORKSPACE mit Scheme: $SCHEME"
          
          # 4. Erzwinge Workspace-Build
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Zip Payload to IPA
        run: |
          APP_PATH=$(find . -type d -name "*.app" | head -n 1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r SegwayWorld.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SegwayWorld-IPA
          path: "**/SegwayWorld.ipa"
