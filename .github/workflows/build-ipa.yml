name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Install Pods and Build
        run: |
          # 1. Ordner mit dem Projekt finden
          PROJ_FILE=$(find . -name "*.xcodeproj" -not -path "*/Pods/*" | head -n 1)
          PROJ_DIR=$(dirname "$PROJ_FILE")
          cd "$PROJ_DIR"
          
          # 2. CocoaPods installieren (für FirebaseMessaging)
          pod repo update || true
          pod install || true

          # 3. Prüfen ob Workspace entstanden ist, sonst Projekt nutzen
          WORKSPACE=$(find . -maxdepth 2 -name "*.xcworkspace" -not -path "*/Pods/*" | head -n 1)
          
          if [ -n "$WORKSPACE" ]; then
            xcodebuild -workspace "$WORKSPACE" -scheme "SegwayWorld" -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" AD_HOC_CODE_SIGNING_ALLOWED=YES
          else
            xcodebuild -project "$PROJ_FILE" -scheme "SegwayWorld" -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" AD_HOC_CODE_SIGNING_ALLOWED=YES
          fi

      - name: Zip Payload to IPA
        run: |
          APP_PATH=$(find . -type d -name "*.app" | head -n 1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r SegwayWorld.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SegwayWorld-IPA
          path: "**/SegwayWorld.ipa"
