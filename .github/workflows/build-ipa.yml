name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Clean Firebase Dependencies and Build
        run: |
          # 1. Projektordner finden
          PROJ_FILE=$(find . -name "*.xcodeproj" -not -path "*/Pods/*" | head -n 1)
          PROJ_DIR=$(dirname "$PROJ_FILE")
          cd "$PROJ_DIR"
          
          # 2. Firebase-Referenzen aus dem Swift-Code entfernen, um Build-Blockaden zu verhindern
          find . -name "*.swift" -exec sed -i '' '/import Firebase/d' {} +
          find . -name "*.swift" -exec sed -i '' '/Messaging/d' {} +
          
          # 3. Falls vorhanden, PushNotifications.swift leeren
          if [ -f "SegwayWorld/PushNotifications.swift" ]; then
            echo "// Disabled Push Notifications" > SegwayWorld/PushNotifications.swift
          fi
          
          # 4. Direktes Compilieren des Xcode-Projekts
          SCHEME=$(xcodebuild -project "$PROJ_FILE" -list | awk '/Schemes:/{flag=1; next} /^[[:space:]]*$/{flag=0} flag' | head -n 1 | xargs)
          
          xcodebuild -project "$PROJ_FILE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Zip Payload to IPA
        run: |
          APP_PATH=$(find . -type d -name "*.app" | head -n 1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r SegwayWorld.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SegwayWorld-IPA
          path: "**/SegwayWorld.ipa"
