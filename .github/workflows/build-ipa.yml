name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Build Xcode Project
        run: |
          # 1. Absoluten Pfad zur Xcode-Projektdatei finden
          PROJ_FILE=$(find "$GITHUB_WORKSPACE" -name "*.xcodeproj" -not -path "*/Pods/*" | head -n 1)
          PROJ_DIR=$(dirname "$PROJ_FILE")
          
          # 2. In den Ordner der xcodeproj wechseln
          cd "$PROJ_DIR"
          
          # 3. Firebase-Imports auskommentieren gegen Swift-Compilerfehler
          find . -name "*.swift" -exec sed -i '' 's/import Firebase/\/\/ import Firebase/g' {} +
          
          # 4. Nur den Dateinamen für xcodebuild nutzen
          PROJ_NAME=$(basename "$PROJ_FILE")
          SCHEME=$(xcodebuild -project "$PROJ_NAME" -list | awk '/Schemes:/{flag=1; next} /^[[:space:]]*$/{flag=0} flag' | head -n 1 | xargs)
          
          # 5. Build starten
          xcodebuild build \
            -project "$PROJ_NAME" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Zip Payload to IPA
        run: |
          APP_PATH=$(find "$GITHUB_WORKSPACE" -type d -name "*.app" | head -n 1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r SegwayWorld.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SegwayWorld-IPA
          path: SegwayWorld.ipa
